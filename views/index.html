<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunke Bot - Multi AFK Client</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --bg-card: #130c22;
      --primary: #bd00ff;
      --primary-glow: rgba(189, 0, 255, 0.4);
      --accent: #8a2be2;
      --text: #e2d9f3;
      --text-muted: #887b9c;
      --red-eye: #ff3366;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 5px;
      flex: none;
    }
    h1 {
      color: var(--primary);
      margin: 5px 0;
      font-size: 2rem;
      text-shadow: 0 0 10px var(--primary-glow);
      letter-spacing: 2px;
    }
    .grid-main {
      display: grid;
      grid-template-columns: 1.2fr 2fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
      margin-bottom: 10px;
    }
    @media (max-width: 900px) {
      .grid-main { grid-template-columns: 1fr; height: auto; overflow: auto; }
    }
    .card {
      background-color: var(--bg-card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      border: 1px solid rgba(189, 0, 255, 0.15);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .card h3 {
      margin: 0 0 15px 0;
      color: var(--primary);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(189, 0, 255, 0.2);
      padding-bottom: 5px;
      flex: none;
    }
    
    /* Form */
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: var(--text-muted); }
    .form-control {
      width: 100%; box-sizing: border-box; background-color: #0a0612;
      border: 1px solid rgba(189, 0, 255, 0.3); color: white;
      padding: 8px 10px; border-radius: 6px; font-size: 0.9rem;
    }
    .form-control:focus { outline: none; border-color: var(--primary); }
    .form-control:disabled {
      background-color: rgba(189, 0, 255, 0.03);
      border-color: rgba(189, 0, 255, 0.05);
      color: #777;
    }
    
    /* Hesap Listesi */
    .account-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }
    .account-row {
      background-color: #0a0612;
      border: 1px solid rgba(189,0,255,0.1);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .account-row:hover, .account-row.selected {
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
    }
    .acc-info { display: flex; align-items: center; gap: 10px; }
    .acc-avatar { width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--primary); image-rendering: pixelated; }
    
    /* Butonlar */
    button { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-connect { background-color: var(--primary); color: white; }
    .btn-disconnect { background-color: var(--red-eye); color: white; }
    .btn-add { background-color: var(--accent); color: white; width: 100%; margin-top: 10px; }
    .btn-delete { background-color: #444; color: #ff3366; padding: 6px 10px; }
    .btn-send { background-color: var(--primary); color: white; width: 90px; }
    .btn-save { background-color: #4caf50; color: white; width: 100%; margin-top: 10px; }
    .toggle-advanced-btn {
      background: none; border: 1px solid var(--accent); color: var(--text);
      cursor: pointer; width: 100%; padding: 6px; margin-top: 5px; border-radius: 6px; font-size: 0.8rem;
    }

    /* Gelişmiş Ayarlar */
    .advanced-section { display: none; margin-top: 15px; border-top: 1px dashed rgba(189, 0, 255, 0.3); padding-top: 15px; }

    /* Discord Tarzı Chat Kutusu */
    .chat-box {
      background-color: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      border: 1px solid rgba(189, 0, 255, 0.15);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .chat-box::before {
      content: '';
      position: absolute;
      top: 45px;
      left: 0;
      right: 0;
      height: 35px;
      background: linear-gradient(to bottom, var(--bg-card) 0%, rgba(19, 12, 34, 0) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .chat-header {
      padding: 12px 20px;
      background-color: #1a122e;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      font-weight: bold;
      color: var(--primary);
      border-bottom: 1px solid rgba(189,0,255,0.2);
      flex: none;
    }
    .chat-messages {
      flex: 1;
      padding: 20px 15px 15px 15px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(189,0,255,0.1);
      background-color: #080410;
    }
    
    /* GÖNDERİCİ SEÇİMİ VE GİRİŞ KUTUSU TASARIM DÜZELTMESİ */
    .chat-input-area { display: flex; padding: 10px; gap: 10px; flex: none; }
    .chat-select, .chat-input {
      background-color: #0a0612 !important;
      border: 1px solid rgba(189, 0, 255, 0.3) !important;
      color: #e2d9f3 !important;
      padding: 10px 15px !important;
      border-radius: 6px !important;
      font-size: 0.9rem !important;
      box-sizing: border-box;
    }
    .chat-select { width: 140px; cursor: pointer; }
    .chat-input { flex: 1; }
    .chat-select:focus, .chat-input:focus {
      outline: none !important;
      border-color: var(--primary) !important;
      box-shadow: 0 0 8px var(--primary-glow) !important;
    }
    
    /* Canlı Chat Satırları & Etiketleri */
    .log-entry {
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 5px;
      transition: background-color 0.15s ease;
      border-bottom: 1px solid rgba(189,0,255,0.02);
      display: flex;
      align-items: flex-start;
    }
    .log-entry:hover { background-color: rgba(189, 0, 255, 0.05); }
    .chat-tag {
      font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 0.72rem;
      margin-right: 8px; display: inline-block; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .tag-system { background-color: #2b1f47; color: #d8b4fe; }
    .tag-error { background-color: #581c24; color: #fca5a5; }
    .tag-login { background-color: #14532d; color: #86efac; }
    .tag-ad { background-color: #713f12; color: #fde047; }
    .tag-loop { background-color: #1e3a8a; color: #93c5fd; }
    .tag-server { background-color: #1e293b; color: #94a3b8; }
    .chat-text { color: #d1c8e2; line-height: 1.4; word-break: break-all; }
    
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-online { background-color: #4caf50; color: white; }
    .badge-offline { background-color: #f44336; color: white; }
    .badge-connecting { background-color: #ff9800; color: white; }

    /* KOZMİK MOR MODAL YAPISI */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(10, 6, 18, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background-color: var(--bg-card);
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
      border-radius: 14px;
      width: 90%;
      max-width: 500px;
      max-height: 85%;
      overflow-y: auto;
      padding: 25px;
      position: relative;
      animation: modalFadeIn 0.25s ease;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: none; border: none;
      color: var(--text-muted); font-size: 1.5rem;
      cursor: pointer; transition: color 0.2s;
    }
    .modal-close-btn:hover { color: var(--red-eye); }

    /* TIKLA-DOLDUR SON YAZILAN BALONCUK ALANI (Son 5 Mesaj / Yatay Esnek Yapı) */
    .last-sent-container {
      display: none;
      padding: 6px 15px;
      background-color: #0b0718;
      font-size: 0.8rem;
      border-top: 1px solid rgba(189,20,255,0.05);
      align-items: center;
      gap: 10px;
      flex-wrap: wrap; /* Taşmaları önler alt satıra geçer */
      flex-shrink: 0;
    }
    .last-sent-bubble {
      background-color: #2b1f47;
      color: #d8b4fe;
      padding: 3px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid rgba(189,0,255,0.2);
      font-family: monospace;
      transition: all 0.2s ease;
    }
    .last-sent-bubble:hover {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 0 8px var(--primary-glow);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LUNKE BOT</h1>
      <p style="margin: 0; color: var(--text-muted); font-size: 0.85rem; letter-spacing: 2px;">MULTI ACCOUNT AFK CLIENT</p>
    </header>

    <div class="grid-main">
      <!-- Sol Panel -->
      <div style="display: flex; flex-direction: column; gap: 15px; min-height: 0;">
        <!-- Hesap Ekleme Kartı -->
        <div class="card" style="padding: 15px; flex: none;">
          <h3 style="font-size:0.9rem; margin-bottom:10px;">Yeni Hesap Ekle</h3>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
            <div class="form-group">
              <label style="font-size:0.75rem;">Kullanıcı Adı (Nick)</label>
              <input type="text" id="add-user" class="form-control" style="padding:6px;" placeholder="Örn: LunkePlayer">
            </div>
            <div class="form-group">
              <label style="font-size:0.75rem;">Sürüm</label>
              <select id="add-version" class="form-control" style="padding:5px; font-size:0.85rem;">
                <option value="1.21.11" selected>1.21.11</option>
                <option value="1.21.9">1.21.9</option>
                <option value="1.21.8">1.21.8</option>
                <option value="1.21.6">1.21.6</option>
                <option value="1.21.5">1.21.5</option>
                <option value="1.21.4">1.21.4</option>
                <option value="1.21.3">1.21.3</option>
                <option value="1.21.1">1.21.1</option>
                <option value="1.21">1.21</option>
                <option value="1.20.6">1.20.6</option>
                <option value="1.20.5">1.20.5</option>
                <option value="1.20.4">1.20.4</option>
                <option value="1.20.3">1.20.3</option>
                <option value="1.20.2">1.20.2</option>
                <option value="1.20.1">1.20.1</option>
              </select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
            <div class="form-group">
              <label style="font-size:0.75rem;">Sunucu IP</label>
              <input type="text" id="add-host" class="form-control" style="padding:6px;" placeholder="Örn: sunucu.com">
            </div>
            <div class="form-group">
              <label style="font-size:0.75rem;">Port</label>
              <input type="number" id="add-port" class="form-control" style="padding:6px;" value="25565">
            </div>
          </div>

          <button class="toggle-advanced-btn" onclick="toggleAdvanced()" style="padding: 4px; font-size: 0.75rem;">⚙️ Otomasyon Ayarları</button>

          <!-- Gelişmiş Ayarlar Bölümü -->
          <div class="advanced-section" id="advanced-section">
            <div class="form-group">
              <label style="font-size:0.75rem;">Sıralı Giriş Komutları (Her satıra bir komut)</label>
              <textarea id="add-commands" class="form-control" rows="2" style="font-family: monospace; font-size:0.8rem;" placeholder="/login sifre123&#10;/server faction"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
              <div class="form-group">
                <label style="font-size:0.75rem;">Reklam Mesajı</label>
                <input type="text" id="add-broadcast-msg" class="form-control" style="padding:6px; font-size:0.85rem;" placeholder="Maden pazar aktif!">
              </div>
              <div class="form-group">
                <label style="font-size:0.75rem;">Sıklık (s)</label>
                <input type="number" id="add-broadcast-interval" class="form-control" style="padding:6px; font-size:0.85rem;" value="300">
              </div>
            </div>
            <!-- Çift Komut Döngü Otomasyonu -->
            <div style="border-top: 1px dashed rgba(189,0,255,0.2); margin-top: 8px; padding-top: 8px;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                  <label style="font-size:0.75rem;">Döngü Komut 1</label>
                  <input type="text" id="add-loop-cmd1" class="form-control" style="padding:6px; font-size:0.85rem;" placeholder="/warp zindan">
                </div>
                <div class="form-group">
                  <label style="font-size:0.75rem;">Döngü Komut 2</label>
                  <input type="text" id="add-loop-cmd2" class="form-control" style="padding:6px; font-size:0.85rem;" placeholder="/back">
                </div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                  <label style="font-size:0.75rem;">Sıklık (s)</label>
                  <input type="number" id="add-loop-interval" class="form-control" style="padding:6px; font-size:0.85rem;" value="300">
                </div>
                <div class="form-group">
                  <label style="font-size:0.75rem;">Gecikme (s)</label>
                  <input type="number" id="add-loop-delay" class="form-control" style="padding:6px; font-size:0.85rem;" value="10">
                </div>
              </div>
            </div>
          </div>

          <button class="btn-add" onclick="addAccount()">Hesabı Listeye Ekle</button>
        </div>

        <!-- Hesap Listesi Kartı -->
        <div class="card" style="flex: 1;">
          <h3>Hesaplar Listesi</h3>
          <div class="account-list" id="account-list"></div>
        </div>
      </div>

      <!-- Sağ Panel: Tam Ekran Sohbet Kutusu -->
      <div class="chat-box">
        <div class="chat-header" id="chat-header-title">Sohbet & Konsol Günlükleri (Hesap Seçilmedi)</div>
        <div class="chat-messages" id="chat-messages"></div>
        
        <!-- TIKLA-DOLDUR SON YAZILAN BALONCUK ALANI (Son 5 Mesaj Listesi) -->
        <div class="last-sent-container" id="last-sent-container">
          <span style="color: var(--text-muted); font-size: 0.75rem;">Son Yazılanlar (Tıkla Doldur):</span>
          <div id="last-sent-bubbles-list" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;"></div>
        </div>

        <div class="chat-input-area">
          <select id="chat-sender" class="chat-select">
            <option value="all">Tüm Botlar</option>
          </select>
          <input type="text" id="chat-input" class="chat-input" placeholder="Seçili bot ile mesaj gönder..." onkeydown="if(event.key === 'Enter') sendMessage()">
          <button class="btn-send" onclick="sendMessage()">Gönder</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PROFiL MODAL'I -->
  <div class="modal-overlay" id="bot-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">×</button>
      <h3 style="color: var(--primary); margin: 0 0 15px 0; border-bottom: 1px solid rgba(189,0,255,0.2); padding-bottom: 5px;" id="det-title">Profil Kartı</h3>
      
      <!-- Özet Durum Satırı -->
      <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
        <img id="det-avatar" src="https://mc-heads.net/avatar/char" style="width:55px; height:50px; border-radius:6px; border:2px solid var(--primary); image-rendering: pixelated;">
        <div>
          <p id="det-status" style="margin:2px 0; font-weight:bold;"><span class="badge badge-offline">ÇEVRİMDIŞI 🔴</span></p>
          <p id="det-hp" style="margin:2px 0; font-size:0.9rem;">Can: - | Açlık: -</p>
          <p id="det-pos" style="margin:2px 0; font-size:0.85rem; color:var(--text-muted)">X: - | Y: - | Z: -</p>
        </div>
      </div>
      
      <!-- Düzenlenebilir Form Alanları -->
      <div style="border-top: 1px dashed rgba(189,20,255,0.15); padding-top: 12px; margin-bottom: 12px;">
        <p id="edit-lock-notice" style="color: #ffeb3b; font-size: 0.75rem; margin: 0 0 10px 0; display: none;">⚠️ Bot aktif olduğu için ayarlar düzenlemeye kapalıdır.</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
          <div class="form-group">
            <label style="font-size: 0.75rem;">Kullanıcı Adı (Nick)</label>
            <input type="text" id="det-edit-user" class="form-control" style="font-size:0.85rem; padding: 6px;">
          </div>
          <div class="form-group">
            <label style="font-size: 0.75rem;">Sürüm</label>
            <select id="det-edit-version" class="form-control" style="font-size:0.85rem; padding: 4px;">
              <option value="1.21.11">1.21.11</option>
              <option value="1.21.9">1.21.9</option>
              <option value="1.21.8">1.21.8</option>
              <option value="1.21.6">1.21.6</option>
              <option value="1.21.5">1.21.5</option>
              <option value="1.21.4">1.21.4</option>
              <option value="1.21.3">1.21.3</option>
              <option value="1.21.1">1.21.1</option>
              <option value="1.21">1.21</option>
              <option value="1.20.6">1.20.6</option>
              <option value="1.20.5">1.20.5</option>
              <option value="1.20.4">1.20.4</option>
              <option value="1.20.3">1.20.3</option>
              <option value="1.20.2">1.20.2</option>
              <option value="1.20.1">1.20.1</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 8px;">
          <div class="form-group">
            <label style="font-size: 0.75rem;">Sunucu IP</label>
            <input type="text" id="det-edit-host" class="form-control" style="font-size:0.85rem; padding: 6px;">
          </div>
          <div class="form-group">
            <label style="font-size: 0.75rem;">Port</label>
            <input type="number" id="det-edit-port" class="form-control" style="font-size:0.85rem; padding: 6px;">
          </div>
        </div>

        <!-- Katlanabilir Otomasyon Düzenleme Başlığı -->
        <button class="toggle-advanced-btn" onclick="toggleEditAdvanced()" style="padding: 4px; font-size: 0.75rem; margin-bottom: 8px;">⚙️ Otomasyon Ayarlarını Düzenle</button>

        <div id="det-edit-advanced-section" style="display: none; border-top: 1px solid rgba(189,20,255,0.1); padding-top: 8px;">
          <div class="form-group" style="margin-bottom: 8px;">
            <label style="font-size: 0.72rem; color:var(--text-muted);">Giriş Komutları (Satır satır)</label>
            <textarea id="det-edit-commands" class="form-control" rows="2" style="font-size:0.8rem; font-family: monospace;"></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 8px;">
            <div class="form-group">
              <label style="font-size: 0.72rem; color:var(--text-muted);">Oto-Reklam Mesajı</label>
              <input type="text" id="det-edit-broadcast-msg" class="form-control" style="font-size:0.85rem; padding: 6px;">
            </div>
            <div class="form-group">
              <label style="font-size: 0.72rem; color:var(--text-muted);">Sıklık (s)</label>
              <input type="number" id="det-edit-broadcast-interval" class="form-control" style="font-size:0.85rem; padding: 6px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
            <div class="form-group">
              <label style="font-size: 0.72rem; color:var(--text-muted);">Döngü Komut 1</label>
              <input type="text" id="det-edit-loop-cmd1" class="form-control" style="font-size:0.85rem; padding: 6px;">
            </div>
            <div class="form-group">
              <label style="font-size: 0.72rem; color:var(--text-muted);">Döngü Komut 2</label>
              <input type="text" id="det-edit-loop-cmd2" class="form-control" style="font-size:0.85rem; padding: 6px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group">
              <label style="font-size: 0.72rem; color:var(--text-muted);">Döngü Sıklık (s)</label>
              <input type="number" id="det-edit-loop-interval" class="form-control" style="font-size:0.85rem; padding: 6px;">
            </div>
            <div class="form-group">
              <label style="font-size: 0.72rem; color:var(--text-muted);">Gecikme (s)</label>
              <input type="number" id="det-edit-loop-delay" class="form-control" style="font-size:0.85rem; padding: 6px;">
            </div>
          </div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
        <button class="btn-connect" onclick="actionSelected('connect')">Bağlan</button>
        <button class="btn-disconnect" onclick="actionSelected('disconnect')">Bağlantı Kes</button>
        <button class="btn-afk" onclick="actionSelected('toggle-afk')">AFK Değiştir</button>
        <button class="btn-respawn" onclick="actionSelected('respawn')">Yeniden Doğ</button>
      </div>

      <!-- Değişiklikleri Kaydet Butonu -->
      <button class="btn-save" id="btn-det-save" onclick="saveSelectedChanges()">Değişiklikleri Kaydet</button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    let selectedUsername = null;
    let localStatusData = {}; 
    let chatHistories = {};
    let renderedUsernames = [];
    
    // [YENİ]: Son gönderilen 5 mesajı hafızada tuttuğumuz dizi
    let lastSentMessages = [];

    // Discord Tarzı Renkli Chat Parser'ı
    function formatChatLine(text) {
      let tagClass = 'tag-server';
      let tagIcon = '💬';
      let tagText = 'Sunucu';

      if (text.startsWith('[Sistem]')) {
        tagClass = 'tag-system'; tagIcon = '⚙️'; tagText = 'Sistem';
        text = text.replace('[Sistem] ', '');
      } else if (text.startsWith('[Hata]')) {
        tagClass = 'tag-error'; tagIcon = '⚠️'; tagText = 'Hata';
        text = text.replace('[Hata] ', '');
      } else if (text.startsWith('[Proxy Hatası]')) {
        tagClass = 'tag-error'; tagIcon = '⚠️'; tagText = 'Proxy';
        text = text.replace('[Proxy Hatası] ', '');
      } else if (text.startsWith('[Oto-Giriş]')) {
        tagClass = 'tag-login'; tagIcon = '🤖'; tagText = 'Giriş';
        text = text.replace('[Oto-Giriş]: ', '');
      } else if (text.startsWith('[Oto-Reklam]')) {
        tagClass = 'tag-ad'; tagIcon = '📢'; tagText = 'Reklam';
        text = text.replace('[Oto-Reklam]: ', '');
      } else if (text.startsWith('[Oto-Döngü]')) {
        tagClass = 'tag-loop'; tagIcon = '🔁'; tagText = 'Döngü';
        text = text.replace('[Oto-Döngü]: ', '').replace('[Oto-Döngü Gecikmeli]: ', '');
      }

      if (text.startsWith('[Sunucu]:')) {
        text = text.replace('[Sunucu]: ', '');
      }

      // Oyuncu isimlerini altın sarısı, mesajları yumuşak beyaz yapar
      text = text.replace(/^&lt;([^&]+)&gt;(.*)$/, '<span style="color: #ffeb3b; font-weight: bold; text-shadow: 0 0 5px rgba(255,235,59,0.2);">&lt;$1&gt;</span><span style="color: #e2d9f3;">$2</span>');
      text = text.replace(/^([^:\s]+): (.*)$/, '<span style="color: #ffeb3b; font-weight: bold; text-shadow: 0 0 5px rgba(255,235,59,0.2);">$1:</span> <span style="color: #e2d9f3;">$2</span>');

      return '<span class="chat-tag ' + tagClass + '">' + tagIcon + ' ' + tagText + '</span><span class="chat-text">' + text + '</span>';
    }

    function appendLogToScreen(text, type = 'server') {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = formatChatLine(text);
      
      const isScrolledToBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 60;
      chatMessages.appendChild(div);
      
      if (isScrolledToBottom) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function addLogToHistory(botName, text, type = 'server') {
      if (!chatHistories[botName]) {
        chatHistories[botName] = [];
      }
      chatHistories[botName].push({ text, type });

      if (chatHistories[botName].length > 150) {
        chatHistories[botName].shift();
      }

      if (selectedUsername === botName) {
        appendLogToScreen(text, type);
      }
    }

    function toggleAdvanced() {
      const section = document.getElementById('advanced-section');
      section.style.display = section.style.display === 'block' ? 'none' : 'block';
    }

    function toggleEditAdvanced() {
      const section = document.getElementById('det-edit-advanced-section');
      section.style.display = section.style.display === 'block' ? 'none' : 'block';
    }

    function closeModal() {
      document.getElementById('bot-modal').style.display = 'none';
    }

    // [YENİ]: Seçilen mesaja tıklandığında giriş kutusuna dolduran fonksiyon
    function recallMessage(msg) {
      const input = document.getElementById('chat-input');
      input.value = msg;
      input.focus(); // İmleci otomatik kutunun içine odaklar
    }

    // [YENİ]: Son gönderilen 5 mesajın baloncuk listesini ekrana çizen fonksiyon
    function renderLastSentBubbles() {
      const container = document.getElementById('last-sent-container');
      const listDiv = document.getElementById('last-sent-bubbles-list');
      
      if (lastSentMessages.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      listDiv.innerHTML = ''; // Eski listeyi temizle

      lastSentMessages.forEach(function(msg) {
        const span = document.createElement('span');
        span.className = 'last-sent-bubble';
        span.textContent = msg;
        span.onclick = function() {
          recallMessage(msg);
        };
        listDiv.appendChild(span);
      });
    }

    async function addAccount() {
      const username = document.getElementById('add-user').value.trim();
      const host = document.getElementById('add-host').value.trim();
      const port = parseInt(document.getElementById('add-port').value);
      const version = document.getElementById('add-version').value; 
      
      const commands = document.getElementById('add-commands').value;
      const broadcastMsg = document.getElementById('add-broadcast-msg').value.trim();
      const broadcastInterval = parseInt(document.getElementById('add-broadcast-interval').value) || 300;

      const loopCmd1 = document.getElementById('add-loop-cmd1').value.trim();
      const loopCmd2 = document.getElementById('add-loop-cmd2').value.trim();
      const loopInterval = parseInt(document.getElementById('add-loop-interval').value) || 300;
      const loopDelay = parseInt(document.getElementById('add-loop-delay').value) || 10;

      if (!username || !host) {
        alert('Kullanıcı adı ve Sunucu IP boş bırakılamaz.');
        return;
      }

      const res = await fetch('/api/accounts/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          username, host, port, version, commands, broadcastMsg, broadcastInterval,
          loopCmd1, loopCmd2, loopInterval, loopDelay
        })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('add-user').value = '';
        document.getElementById('add-commands').value = '';
        document.getElementById('add-broadcast-msg').value = '';
        document.getElementById('add-loop-cmd1').value = '';
        document.getElementById('add-loop-cmd2').value = '';
        
        chatHistories[username] = [];
        addLogToHistory(username, '[Sistem] Hesap oluşturuldu ve listeye eklendi: ' + username, 'system');
        
        renderedUsernames = []; 
      } else {
        alert(data.error || 'Hesap eklenirken bir hata oluştu.');
      }
    }

    async function saveSelectedChanges() {
      if (!selectedUsername) return;

      const payload = {
        originalUsername: selectedUsername,
        username: document.getElementById('det-edit-user').value.trim(),
        version: document.getElementById('det-edit-version').value, 
        host: document.getElementById('det-edit-host').value.trim(),
        port: parseInt(document.getElementById('det-edit-port').value) || 25565,
        commands: document.getElementById('det-edit-commands').value,
        broadcastMsg: document.getElementById('det-edit-broadcast-msg').value.trim(),
        broadcastInterval: parseInt(document.getElementById('det-edit-broadcast-interval').value) || 300,
        loopCmd1: document.getElementById('det-edit-loop-cmd1').value.trim(),
        loopCmd2: document.getElementById('det-edit-loop-cmd2').value.trim(),
        loopInterval: parseInt(document.getElementById('det-edit-loop-interval').value) || 300,
        loopDelay: parseInt(document.getElementById('det-edit-loop-delay').value) || 10
      };

      if (!payload.username || !payload.host) {
        alert('Kullanıcı adı ve Sunucu IP boş bırakılamaz.');
        return;
      }

      const res = await fetch('/api/accounts/edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      
      if (data.success) {
        if (!localStatusData[payload.username]) {
          localStatusData[payload.username] = {};
        }
        localStatusData[payload.username].version = payload.version;
        localStatusData[payload.username].host = payload.host;
        localStatusData[payload.username].port = payload.port;
        localStatusData[payload.username].commands = payload.commands;
        localStatusData[payload.username].broadcastMsg = payload.broadcastMsg;
        localStatusData[payload.username].broadcastInterval = payload.broadcastInterval;
        localStatusData[payload.username].loopCmd1 = payload.loopCmd1;
        localStatusData[payload.username].loopCmd2 = payload.loopCmd2;
        localStatusData[payload.username].loopInterval = payload.loopInterval;
        localStatusData[payload.username].loopDelay = payload.loopDelay;

        appendLogToScreen('[Sistem] Profil ayarları başarıyla güncellendi.', 'system');
        
        if (payload.username !== selectedUsername) {
          chatHistories[payload.username] = chatHistories[selectedUsername] || [];
          delete chatHistories[selectedUsername];
          delete localStatusData[selectedUsername]; 
          selectedUsername = payload.username;
        }
        
        renderedUsernames = [];
        selectAccount(selectedUsername);
        closeModal(); 
      } else {
        alert(data.error || 'Profil güncellenirken bir hata oluştu.');
      }
    }

    async function deleteAccount(username, event) {
      event.stopPropagation(); 
      if (!confirm(username + ' hesabını silmek istiyor musunuz?')) return;

      const res = await fetch('/api/accounts/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      if (data.success) {
        delete chatHistories[username]; 
        if (selectedUsername === username) {
          selectedUsername = null;
          closeModal();
        }
        renderedUsernames = [];
      } else {
        alert(data.error || 'Hesap silinirken bir hata oluştu.');
      }
    }

    // Listeden bir hesaba tıklandığında: Sohbeti açar, modali tetikler
    function selectAccount(username, isExplicitClick = true) {
      if (selectedUsername === username && isExplicitClick && document.getElementById('bot-modal').style.display === 'flex') {
        closeModal();
        return;
      }

      selectedUsername = username;
      document.getElementById('det-title').textContent = username + ' - Profil Kartı';
      document.getElementById('det-avatar').src = 'https://mc-heads.net/avatar/' + username;
      document.getElementById('chat-header-title').textContent = username + ' - Sohbet & Konsol Günlükleri';
      
      document.querySelectorAll('.account-row').forEach(row => {
        row.classList.remove('selected');
      });
      const selectedRow = document.getElementById('acc-row-' + username);
      if (selectedRow) {
        selectedRow.classList.add('selected');
      }

      chatMessages.innerHTML = '';
      const history = chatHistories[username] || [];
      history.forEach(log => {
        appendLogToScreen(log.text, log.type);
      });

      const senderSelect = document.getElementById('chat-sender');
      if (senderSelect) {
        senderSelect.value = username;
      }

      const s = localStatusData[username];
      if (s) {
        document.getElementById('det-edit-user').value = username;
        document.getElementById('det-edit-version').value = s.version || '1.20.1';
        document.getElementById('det-edit-host').value = s.host || '';
        document.getElementById('det-edit-port').value = s.port || 25565;
        document.getElementById('det-edit-commands').value = s.commands || '';
        document.getElementById('det-edit-broadcast-msg').value = s.broadcastMsg || '';
        document.getElementById('det-edit-broadcast-interval').value = s.broadcastInterval || 300;
        document.getElementById('det-edit-loop-cmd1').value = s.loopCmd1 || '';
        document.getElementById('det-edit-loop-cmd2').value = s.loopCmd2 || '';
        document.getElementById('det-edit-loop-interval').value = s.loopInterval || 300;
        document.getElementById('det-edit-loop-delay').value = s.loopDelay || 10;
      }

      updateDetailUI();

      if (isExplicitClick) {
        document.getElementById('bot-modal').style.display = 'flex';
      }
    }

    // [Gelişmiş Sohbet Sekmesi Seçici]
    document.getElementById('chat-sender').onchange = function() {
      const val = this.value;
      if (val && val !== 'all') {
        selectAccount(val, false); 
      }
    };

    async function actionSelected(action) {
      if (!selectedUsername) return;
      await fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: selectedUsername, action })
      });
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      const sender = document.getElementById('chat-sender').value;

      if (!message) return;
      input.value = '';

      // [YENİ]: Gönderilen mesajı son 5 mesaj listesine ekliyoruz (Tekrar edenleri eliyoruz)
      lastSentMessages = lastSentMessages.filter(m => m !== message);
      lastSentMessages.unshift(message); // En başa ekle
      if (lastSentMessages.length > 5) {
        lastSentMessages.pop(); // Son elemanı sil (maksimum 5 adet tut)
      }
      renderLastSentBubbles(); // Baloncukları yeniden çizdir

      if (sender === 'all') {
        Object.keys(chatHistories).forEach(usr => {
          addLogToHistory(usr, '[Sen]: ' + message, 'system');
        });
      } else {
        addLogToHistory(sender, '[Sen]: ' + message, 'system');
      }

      await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sender })
      });
    }

    function updateDetailUI() {
      if (!selectedUsername || !localStatusData[selectedUsername]) {
        const txtStatus = document.getElementById('det-status');
        if (txtStatus) txtStatus.innerHTML = '<span class="badge badge-offline">SEÇİLMEDİ 🔴</span>';
        
        const txtHp = document.getElementById('det-hp');
        if (txtHp) txtHp.textContent = 'Can: - | Açlık: -';
        
        const txtPos = document.getElementById('det-pos');
        if (txtPos) txtPos.textContent = 'X: - | Y: - | Z: -';
        
        setEditFormDisabled(true);
        return;
      }

      const s = localStatusData[selectedUsername];
      const txtStatus = document.getElementById('det-status');
      const txtHp = document.getElementById('det-hp');
      const txtPos = document.getElementById('det-pos');

      setEditFormDisabled(s.online || s.connecting);

      if (s.online) {
        if (txtStatus) txtStatus.innerHTML = '<span class="badge badge-online">ÇEVRİMİÇİ 🟢</span>';
        if (txtHp) txtHp.textContent = '❤️ Can: ' + s.health + ' | 🍗 Açlık: ' + s.food;
        if (txtPos) txtPos.textContent = 'X: ' + s.pos.x + ' | Y: ' + s.pos.y + ' | Z: ' + s.pos.z;
      } else {
        if (txtStatus) txtStatus.innerHTML = s.connecting ? '<span class="badge badge-connecting">BAĞLANILIYOR... 🟡</span>' : '<span class="badge badge-offline">ÇEVRİMDIŞI 🔴</span>';
        if (txtHp) txtHp.textContent = 'Can: - | Açlık: -';
        if (txtPos) txtPos.textContent = 'X: - | Y: - | Z: -';
      }
    }

    function setEditFormDisabled(disabled) {
      const lockNotice = document.getElementById('edit-lock-notice');
      const saveBtn = document.getElementById('btn-det-save');
      
      if (lockNotice) lockNotice.style.display = disabled && selectedUsername && localStatusData[selectedUsername].online ? 'block' : 'none';
      if (saveBtn) saveBtn.style.display = disabled ? 'none' : 'block';

      const fields = [
        'det-edit-user', 'det-edit-version', 'det-edit-host', 'det-edit-port',
        'det-edit-commands', 'det-edit-broadcast-msg', 'det-edit-broadcast-interval',
        'det-edit-loop-cmd1', 'det-edit-loop-cmd2', 'det-edit-loop-interval', 'det-edit-loop-delay'
      ];
      fields.forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.disabled = disabled;
      });
    }

    const eventSource = new EventSource('/api/stream');

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'chat') {
        addLogToHistory(data.bot, data.text, 'server');
      } 
      else if (data.type === 'status_all') {
        localStatusData = data.statuses;
        
        const listDiv = document.getElementById('account-list');
        const activeUsernames = Object.keys(localStatusData);
        
        const isListChanged = JSON.stringify(activeUsernames.sort()) !== JSON.stringify(renderedUsernames.sort());

        if (activeUsernames.length === 0) {
          listDiv.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:40px; font-size:0.9rem; line-height:1.4;">Henüz bir hesap eklenmedi.<br>Başlamak için yukarıdaki formu kullanın.</p>';
          selectedUsername = null;
          renderedUsernames = [];
          closeModal();
        } 
        else if (isListChanged) {
          renderedUsernames = [...activeUsernames];
          listDiv.innerHTML = ''; 

          activeUsernames.forEach(function(usr) {
            const s = localStatusData[usr];
            const isSelected = selectedUsername === usr ? 'selected' : '';

            if (!chatHistories[usr]) {
              chatHistories[usr] = [];
            }

            const row = document.createElement('div');
            row.className = 'account-row ' + isSelected;
            row.id = 'acc-row-' + usr;
            
            row.onclick = function() {
              selectAccount(usr, true);
            };

            let statusBadgeText = '<span class="badge badge-offline">Çevrimdışı</span>';
            if (s.online) statusBadgeText = '<span class="badge badge-online">Çevrimiçi</span>';
            else if (s.connecting) statusBadgeText = '<span class="badge badge-connecting">Bağlanıyor</span>';

            const automationLabel = s.hasAutoBroadcaster || s.hasAutoLoop ? '<br><span style="font-size:0.7rem; color:#ffeb3b">📢 Otomasyon Aktif</span>' : '';

            row.innerHTML = '<div class="acc-info">' +
                              '<img class="acc-avatar" src="https://mc-heads.net/avatar/' + usr + '">' +
                              '<div>' +
                                '<span style="font-weight:bold;">' + usr + '</span><br>' +
                                '<span style="font-size:0.75rem; color:var(--text-muted)">' + s.host + ':' + s.port + '</span>' +
                                automationLabel +
                              '</div>' +
                            '</div>' +
                            '<div style="display:flex; align-items:center; gap:8px;">' +
                              '<span id="badge-' + usr + '" class="badge ' + (s.online ? 'badge-online' : (s.connecting ? 'badge-connecting' : 'badge-offline')) + '">' +
                                (s.online ? 'Çevrimiçi' : (s.connecting ? 'Bağlanıyor' : 'Çevrimdışı')) +
                              '</span>' +
                              '<button class="btn-delete" id="del-btn-' + usr + '">Sil</button>' +
                            '</div>';

            listDiv.appendChild(row);

            const delBtn = document.getElementById('del-btn-' + usr);
            if (delBtn) {
              delBtn.onclick = function(event) {
                deleteAccount(usr, event);
              };
            }
          });
        }

        // Sol listedeki hesap satırlarının badge (durum) etiketlerini her saniye canlı güncelliyoruz! (IP Kilit Bug Çözüldü!)
        activeUsernames.forEach(function(usr) {
          const s = localStatusData[usr];
          const badge = document.getElementById('badge-' + usr);
          
          if (badge) {
            badge.className = 'badge ' + (s.online ? 'badge-online' : (s.connecting ? 'badge-connecting' : 'badge-offline'));
            badge.textContent = s.online ? 'Çevrimiçi' : (s.connecting ? 'Bağlanıyor' : 'Çevrimdışı');
          }
          
          if (selectedUsername === usr && document.getElementById('bot-modal').style.display === 'flex') {
            const txtStatus = document.getElementById('det-status');
            const txtHp = document.getElementById('det-hp');
            const txtPos = document.getElementById('det-pos');
            
            if (txtStatus) {
              txtStatus.innerHTML = s.online ? '<span class="badge badge-online">ÇEVRİMİÇİ 🟢</span>' : (s.connecting ? '<span class="badge badge-connecting">BAĞLANILIYOR... 🟡</span>' : '<span class="badge badge-offline">ÇEVRİMDIŞI 🔴</span>');
            }
            if (txtHp) {
              txtHp.textContent = s.online ? '❤️ Can: ' + s.health + ' | 🍗 Açlık: ' + s.food : 'Can: - | Açlık: -';
            }
            if (txtPos) {
              txtPos.textContent = s.online ? 'X: ' + s.pos.x + ' | Y: ' + s.pos.y + ' | Z: ' + s.pos.z : 'X: - | Y: - | Z: -';
            }
          }
        });

        const senderSelect = document.getElementById('chat-sender');
        const currentSelection = senderSelect.value;
        
        senderSelect.innerHTML = '<option value="all">Tüm Botlar</option>';
        activeUsernames.forEach(usr => {
          const s = localStatusData[usr];
          if (s.online) {
            const opt = document.createElement('option');
            opt.value = usr;
            opt.textContent = usr;
            senderSelect.appendChild(opt);
          }
        });
        senderSelect.value = currentSelection;

        if (selectedUsername) {
          updateDetailUI();
        }
      }
    };
  </script>
</body>
</html>
